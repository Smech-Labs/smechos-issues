name: Bug Report
description: Report something broken in SmechOS (boot, install, drivers, packages, etc.)
labels: ["bug"]
body:
  - type: dropdown
    id: deliverable
    attributes:
      label: Which SmechOS deliverable?
      options:
        - SmechOS-1.0-RC1.iso
        - smechos-installer-tui.iso (EoL)
        - smechos-installer-minimal-netinst.iso (EoL)
        - Installed system (post-install)
        - spk package manager
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect, and what actually happened instead?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Real hardware or VM (which hypervisor)? BIOS or UEFI? CPU vendor?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs/output
      description: Paste any boot messages, error output, or screenshots.
